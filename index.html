<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC Gold Terminal</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09111a;
      color: #a3c2db;
      font-family: 'Courier New', Courier, monospace;
      padding: 10px;
    }
    .hud-panel {
      border: 1px solid #1b3b5a;
      background: #0c1724;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .pair-bar {
      display: flex;
      overflow-x: auto;
      gap: 4px;
      margin-bottom: 8px;
      padding-bottom: 2px;
    }
    .pair-bar button {
      flex: 0 0 auto;
      background: #112236;
      color: #7da1c4;
      border: 1px solid #1e4266;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
    }
    .pair-bar button.active {
      background: #00ffaa;
      color: #09111a;
      border-color: #00ffaa;
    }
    .tf-bar {
      display: flex;
      justify-content: space-between;
      gap: 3px;
      margin-bottom: 10px;
    }
    .tf-bar button {
      flex: 1;
      background: #112236;
      color: #7da1c4;
      border: 1px solid #1e4266;
      padding: 7px 0;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
    }
    .tf-bar button.active {
      background: #00e5ff;
      color: #09111a;
      border-color: #00e5ff;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      margin-bottom: 10px;
      color: #8ab4d8;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot-buy { width: 10px; height: 2px; border-bottom: 2px dashed #00ffaa; }
    .dot-sell { width: 10px; height: 2px; border-bottom: 2px dashed #ff3b5c; }
    .dot-ema { width: 10px; height: 2px; background: #7da1c4; }
    #chart { width: 100%; height: 330px; }
    .news-title {
      color: #5bc0eb;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .news-sub { font-size: 11px; color: #5c7c99; margin-bottom: 8px; }
    #news-feed { font-size: 13px; color: #d0e4f5; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="hud-panel">
    <div class="pair-bar" id="pairs">
      <button class="active" onclick="changePair('XAU/USD', this)">XAUUSD</button>
      <button onclick="changePair('XAG/USD', this)">XAGUSD</button>
      <button onclick="changePair('EUR/USD', this)">EURUSD</button>
      <button onclick="changePair('BTC/USD', this)">BTCUSD</button>
      <button onclick="changePair('ETH/USD', this)">ETHUSD</button>
      <button onclick="changePair('DIA', this)">US30</button>
      <button onclick="changePair('EWG', this)">GER40</button>
    </div>

    <div class="tf-bar" id="timeframes">
      <button onclick="loadChart('1min', this)">1m</button>
      <button onclick="loadChart('5min', this)">5m</button>
      <button onclick="loadChart('15min', this)">15m</button>
      <button onclick="loadChart('30min', this)">30m</button>
      <button class="active" onclick="loadChart('1h', this)">1H</button>
      <button onclick="loadChart('4h', this)">4H</button>
      <button onclick="loadChart('1day', this)">Daily</button>
    </div>

    <div class="legend">
      <span><i class="dot-buy"></i> Buy zone</span>
      <span><i class="dot-sell"></i> Sell zone</span>
      <span><i class="dot-ema"></i> EMA 200</span>
    </div>

    <div id="chart"></div>
  </div>

  <div class="hud-panel">
    <div class="news-title">TODAY'S HIGH-IMPACT USD NEWS</div>
    <div class="news-sub">ForexFactory calendar, SAST local time</div>
    <div id="news-feed">Loading news...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
